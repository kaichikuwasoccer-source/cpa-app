<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>CPA Study Logger</title>
  <link rel="apple-touch-icon" href="icon.png?v=2" />
  <link rel="icon" type="image/png" href="icon.png?v=2" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 18px;
      background: #f3f4f6;
      padding: 4px;
      border-radius: 12px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--muted);
      cursor: pointer;
    }

    .tab-btn.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .section {
      margin-bottom: 16px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    label.title {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .label-row label.title {
      margin-bottom: 0;
    }

    .edit-toggle {
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 6px;
    }

    .timer-box {
      text-align: center;
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .time-display {
      font-size: 2.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-bottom: 12px;
    }

    .timer-btns {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .time-range-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-full {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--border);
      background: #fff;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.15s;
    }

    .chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .chip.editing {
      border-style: dashed;
      border-color: var(--danger);
      color: var(--danger);
      background: #fef2f2;
    }

    .add-material-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .add-material-row input {
      flex: 1;
    }

    .hint {
      font-size: 0.82rem;
      color: var(--muted);
    }

    input[type="number"],
    input[type="text"],
    input[type="time"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    .status {
      text-align: center;
      font-size: 0.85rem;
      margin-top: 10px;
      min-height: 1.2em;
      color: var(--muted);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .kpi-card {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .kpi-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .kpi-value {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .kpi-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .chart-wrap {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" data-tab="logView">記録</button>
      <button class="tab-btn" data-tab="dashView">集計・グラフ</button>
    </div>

    <!-- 記録タブ -->
    <div id="logView" class="view active">
      <div class="section timer-box">
        <div class="time-display" id="display">00:00:00</div>
        <div class="timer-btns">
          <button class="btn btn-primary" id="startStopBtn">開始</button>
          <button class="btn" id="resetBtn">リセット</button>
          <button class="btn" id="syncTimerBtn" title="他端末のタイマー状態を取得">同期</button>
        </div>
      </div>

      <div class="section">
        <label class="title">科目 *</label>
        <div class="chips" id="subjectChips"></div>
      </div>

      <div class="section">
        <div class="label-row">
          <label class="title">教材 *</label>
          <button type="button" class="edit-toggle" id="editMaterialBtn" style="display:none;">編集</button>
        </div>
        <div class="chips" id="materialChips">
          <span class="hint">先に科目を選択してください</span>
        </div>
        <div class="add-material-row" id="addMaterialRow" style="display:none;">
          <input type="text" id="newMaterialInput" placeholder="追加する教材名を入力" />
          <button type="button" class="btn btn-primary" id="addMaterialBtn">追加</button>
        </div>
      </div>

      <div class="section">
        <label class="title" for="studyDateInput">学習日（デフォルト今日／過去日も可）</label>
        <input type="date" id="studyDateInput" />
      </div>

      <div class="section">
        <label class="title">時間帯（タイマーで自動入力／手入力も可）</label>
        <div class="time-range-row">
          <input type="time" id="startTimeInput" />
          <span style="color:var(--muted);">〜</span>
          <input type="time" id="endTimeInput" />
        </div>
      </div>

      <div class="section">
        <label class="title" for="minutes">学習時間（分） *</label>
        <input type="number" id="minutes" min="1" placeholder="タイマー停止で自動入力（手入力も可）" />
      </div>

      <div class="section">
        <label class="title" for="topic">単元・ページ（任意）</label>
        <input type="text" id="topic" placeholder="例：連結会計 P.45〜52" />
      </div>

      <div class="section">
        <label class="title">手応え（任意）</label>
        <div class="chips" id="ratingChips"></div>
      </div>

      <div class="section">
        <label class="title" for="memo">一言メモ（任意）</label>
        <textarea id="memo" placeholder="つまずいた論点や次回の申し送りなど"></textarea>
      </div>

      <button class="btn btn-primary btn-full" id="submitBtn">スプレッドシートに記録する</button>
      <div class="status" id="status"></div>
    </div>

    <!-- 集計・グラフタブ -->
    <div id="dashView" class="view">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-label">今日の勉強時間</div>
          <div class="kpi-value" id="todayActual">--</div>
          <div class="kpi-sub" id="todayPlanned">カレンダー予定: --</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">今週の勉強時間（月〜日）</div>
          <div class="kpi-value" id="weekActual">--</div>
          <div class="kpi-sub" id="weekPlanned">カレンダー予定: --</div>
        </div>
      </div>

      <div class="chart-wrap">
        <label class="title">今週の科目別：予定 vs 実績（時間）</label>
        <canvas id="subjectChart" height="220"></canvas>
      </div>

      <button class="btn btn-full" id="refreshBtn">最新データを読み込む</button>
      <div class="status" id="dashStatus"></div>
    </div>
  </div>

  <script>
    // ===== 設定エリア =====
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzE8uqAzZaCao5IIh2P-9HtpbRxPpCO_hDPfG5tsFb7lxA9iXtgaxp5tI0Zi4VVtvb9/exec';

    const DEFAULT_MATERIALS = {
      '財務(計算)': ['テキスト', '個別問題集', '短答問題集', '答練', '講義'],
      '財務(理論)': ['テキスト', '短答問題集', 'コンサマ', '答練', '講義'],
      '管理会計': ['テキスト', '個別問題集', '短答問題集', '原価計算基準', '答練'],
      '監査論': ['テキスト', '短答問題集', '資料集', '答練', '講義'],
      '企業法': ['テキスト', '短答問題集', '条文・ポケット六法', '答練', '講義'],
      '租税法': ['テキスト', '個別問題集', '理論対策', '答練', '講義'],
      '選択科目': ['テキスト', '問題集', '答練', '講義']
    };
    const RATINGS = ['◎ 余裕', '○ 普通', '△ 要復習'];
    // =====================

    const SUBJECTS = Object.keys(DEFAULT_MATERIALS);
    let materialsBySubject = JSON.parse(JSON.stringify(DEFAULT_MATERIALS));
    let selectedSubject = '';
    let selectedMaterial = '';
    let selectedRating = '';
    let isEditingMaterials = false;
    let chartInstance = null;

    // 起動時にスプレッドシートから最新の教材リスト・タイマー状態を同期
    async function syncFromCloud(showMsg = false) {
      const statusEl = document.getElementById('status');
      if (showMsg) statusEl.textContent = 'クラウドから同期中...';
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        if (data.status === 'ok') {
          if (data.materials && Object.keys(data.materials).length > 0) {
            materialsBySubject = data.materials;
            if (selectedSubject) renderMaterials();
          }
          if (data.activeTimer) {
            applyCloudTimer(data.activeTimer);
          }
          if (showMsg) {
            statusEl.textContent = '他端末の状態と同期しました';
            setTimeout(() => { if (statusEl.textContent.includes('同期')) statusEl.textContent = ''; }, 2500);
          }
        }
      } catch (e) {
        if (showMsg) statusEl.textContent = '同期に失敗しました';
      }
    }

    // 教材リストをスプレッドシートに保存（全デバイス同期）
    async function saveMaterialsToCloud() {
      const statusEl = document.getElementById('status');
      statusEl.textContent = '教材リストを同期中...';
      try {
        await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'saveMaterials', materials: materialsBySubject })
        });
        statusEl.textContent = '教材リストを全デバイスに同期しました';
        setTimeout(() => { if (statusEl.textContent.includes('同期')) statusEl.textContent = ''; }, 2500);
      } catch (e) {
        statusEl.textContent = '教材の同期に失敗しました';
      }
    }

    // タブ切り替え
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'dashView') loadDashboard();
      };
    });

    function renderChips(containerId, items, onSelect) {
      const el = document.getElementById(containerId);
      el.innerHTML = '';
      items.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip';
        btn.textContent = item;
        btn.onclick = () => {
          [...el.children].forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
          onSelect(item);
        };
        el.appendChild(btn);
      });
    }

    const editMaterialBtn = document.getElementById('editMaterialBtn');
    const addMaterialRow = document.getElementById('addMaterialRow');
    const newMaterialInput = document.getElementById('newMaterialInput');

    function renderMaterials() {
      const el = document.getElementById('materialChips');
      if (!selectedSubject) {
        el.innerHTML = '<span class="hint">先に科目を選択してください</span>';
        editMaterialBtn.style.display = 'none';
        addMaterialRow.style.display = 'none';
        return;
      }

      editMaterialBtn.style.display = 'inline-block';
      editMaterialBtn.textContent = isEditingMaterials ? '完了' : '編集';
      addMaterialRow.style.display = isEditingMaterials ? 'flex' : 'none';

      const list = materialsBySubject[selectedSubject] || [];
      el.innerHTML = '';

      if (list.length === 0) {
        el.innerHTML = '<span class="hint">教材がありません。「編集」から追加してください</span>';
        return;
      }

      list.forEach((item, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        if (isEditingMaterials) {
          btn.className = 'chip editing';
          btn.textContent = `${item} ×`;
          btn.onclick = () => {
            materialsBySubject[selectedSubject].splice(idx, 1);
            if (selectedMaterial === item) selectedMaterial = '';
            renderMaterials();
            saveMaterialsToCloud();
          };
        } else {
          btn.className = 'chip' + (selectedMaterial === item ? ' active' : '');
          btn.textContent = item;
          btn.onclick = () => {
            selectedMaterial = item;
            renderMaterials();
          };
        }
        el.appendChild(btn);
      });
    }

    editMaterialBtn.onclick = () => {
      isEditingMaterials = !isEditingMaterials;
      renderMaterials();
    };

    document.getElementById('addMaterialBtn').onclick = () => {
      const name = newMaterialInput.value.trim();
      if (!name || !selectedSubject) return;
      if (!materialsBySubject[selectedSubject]) materialsBySubject[selectedSubject] = [];
      if (!materialsBySubject[selectedSubject].includes(name)) {
        materialsBySubject[selectedSubject].push(name);
        saveMaterialsToCloud();
      }
      newMaterialInput.value = '';
      renderMaterials();
    };

    renderChips('subjectChips', SUBJECTS, subject => {
      selectedSubject = subject;
      selectedMaterial = '';
      isEditingMaterials = false;
      renderMaterials();
    });
    renderChips('ratingChips', RATINGS, v => selectedRating = v.split(' ')[0]);

    // 時刻フォーマット（HH:MM）
    function fmtTime(dateObj) {
      return `${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
    }

    // 日付フォーマット（YYYY-MM-DD）
    function fmtDateInput(dateObj) {
      return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
    }
    const studyDateInput = document.getElementById('studyDateInput');
    studyDateInput.value = fmtDateInput(new Date());

    // タイマー管理（開始時刻・終了時刻・デバイス間同期対応）
    const KEY_START = 'cpa_timer_start';
    const KEY_ACCUM = 'cpa_timer_accum';
    const KEY_FIRST_START = 'cpa_timer_first_start';
    const KEY_UPDATED = 'cpa_timer_updated';
    let timerInterval = null;
    const display = document.getElementById('display');
    const startStopBtn = document.getElementById('startStopBtn');
    const minutesInput = document.getElementById('minutes');
    const startTimeInput = document.getElementById('startTimeInput');
    const endTimeInput = document.getElementById('endTimeInput');

    function getElapsedSec() {
      const accum = Number(localStorage.getItem(KEY_ACCUM) || 0);
      const start = Number(localStorage.getItem(KEY_START) || 0);
      return start ? accum + Math.floor((Date.now() - start) / 1000) : accum;
    }
    function updateDisplay() {
      const sec = getElapsedSec();
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      display.textContent = `${h}:${m}:${s}`;
    }
    function selectSubjectUI(subj, mat) {
      if (!subj || !SUBJECTS.includes(subj)) return;
      selectedSubject = subj;
      selectedMaterial = mat || '';
      isEditingMaterials = false;
      const chips = [...document.getElementById('subjectChips').children];
      chips.forEach(c => c.classList.toggle('active', c.textContent === subj));
      renderMaterials();
    }
    async function saveTimerToCloud() {
      const updatedAt = Date.now();
      localStorage.setItem(KEY_UPDATED, String(updatedAt));
      const timerState = {
        start: Number(localStorage.getItem(KEY_START) || 0),
        accum: Number(localStorage.getItem(KEY_ACCUM) || 0),
        firstStart: Number(localStorage.getItem(KEY_FIRST_START) || 0),
        subject: selectedSubject || '',
        material: selectedMaterial || '',
        updatedAt
      };
      try {
        await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'saveTimer', timer: timerState })
        });
      } catch (e) { }
    }
    function applyCloudTimer(ct) {
      const localUpdated = Number(localStorage.getItem(KEY_UPDATED) || 0);
      if (!ct || !ct.updatedAt || ct.updatedAt <= localUpdated) return;

      clearInterval(timerInterval);
      localStorage.setItem(KEY_UPDATED, String(ct.updatedAt));
      if (ct.start) localStorage.setItem(KEY_START, String(ct.start));
      else localStorage.removeItem(KEY_START);

      if (ct.accum) localStorage.setItem(KEY_ACCUM, String(ct.accum));
      else localStorage.removeItem(KEY_ACCUM);

      if (ct.firstStart) {
        localStorage.setItem(KEY_FIRST_START, String(ct.firstStart));
        startTimeInput.value = fmtTime(new Date(ct.firstStart));
      } else {
        localStorage.removeItem(KEY_FIRST_START);
        startTimeInput.value = '';
      }

      if (ct.subject) selectSubjectUI(ct.subject, ct.material);

      if (ct.start) {
        startStopBtn.textContent = '停止';
        timerInterval = setInterval(updateDisplay, 500);
        updateDisplay();
      } else if (ct.accum > 0) {
        startStopBtn.textContent = '再開';
        updateDisplay();
        minutesInput.value = Math.max(1, Math.round(ct.accum / 60));
      } else {
        startStopBtn.textContent = '開始';
        updateDisplay();
      }
    }
    function startTimer(sync = true) {
      const now = Date.now();
      if (!localStorage.getItem(KEY_START)) localStorage.setItem(KEY_START, String(now));
      if (!localStorage.getItem(KEY_FIRST_START)) {
        localStorage.setItem(KEY_FIRST_START, String(now));
        startTimeInput.value = fmtTime(new Date(now));
      }
      startStopBtn.textContent = '停止';
      clearInterval(timerInterval);
      timerInterval = setInterval(updateDisplay, 500);
      updateDisplay();
      if (sync) saveTimerToCloud();
    }
    function stopTimer(sync = true) {
      const total = getElapsedSec();
      localStorage.setItem(KEY_ACCUM, String(total));
      localStorage.removeItem(KEY_START);
      clearInterval(timerInterval);
      startStopBtn.textContent = '再開';
      updateDisplay();
      if (total > 0) {
        minutesInput.value = Math.max(1, Math.round(total / 60));
        endTimeInput.value = fmtTime(new Date());
      }
      if (sync) saveTimerToCloud();
    }
    function resetTimer(sync = true) {
      clearInterval(timerInterval);
      localStorage.removeItem(KEY_START);
      localStorage.removeItem(KEY_ACCUM);
      localStorage.removeItem(KEY_FIRST_START);
      startStopBtn.textContent = '開始';
      updateDisplay();
      if (sync) saveTimerToCloud();
    }

    startStopBtn.onclick = () => localStorage.getItem(KEY_START) ? stopTimer(true) : startTimer(true);
    document.getElementById('resetBtn').onclick = () => {
      resetTimer(true);
      minutesInput.value = '';
      startTimeInput.value = '';
      endTimeInput.value = '';
    };
    document.getElementById('syncTimerBtn').onclick = () => syncFromCloud(true);

    if (localStorage.getItem(KEY_FIRST_START)) {
      startTimeInput.value = fmtTime(new Date(Number(localStorage.getItem(KEY_FIRST_START))));
    }
    if (localStorage.getItem(KEY_START)) startTimer(false);
    else updateDisplay();

    // 記録送信
    document.getElementById('submitBtn').onclick = async () => {
      const statusEl = document.getElementById('status');
      if (localStorage.getItem(KEY_START)) stopTimer(false);

      const minutes = Number(minutesInput.value);
      if (!selectedSubject || !selectedMaterial || !minutes) {
        statusEl.textContent = '科目・教材・学習時間（分）を入力してください。';
        return;
      }

      const now = new Date();
      const rawDate = studyDateInput.value;
      const dateStr = rawDate
        ? rawDate.replace(/-/g, '/')
        : `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;

      // 時間帯が空欄のまま手入力で送信した場合は、現在時刻から逆算して自動補完
      let endTime = endTimeInput.value;
      let startTime = startTimeInput.value;
      if (!endTime) endTime = fmtTime(now);
      if (!startTime) startTime = fmtTime(new Date(now.getTime() - minutes * 60000));

      const payload = {
        date: dateStr,
        subject: selectedSubject,
        material: selectedMaterial,
        minutes,
        topic: document.getElementById('topic').value.trim(),
        rating: selectedRating,
        memo: document.getElementById('memo').value.trim(),
        start_time: startTime,
        end_time: endTime
      };

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      statusEl.textContent = '送信中...';

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.status === 'ok') {
          statusEl.textContent = `記録しました（${dateStr} ${startTime}〜${endTime} / ${selectedSubject} / ${minutes}分）`;
          resetTimer(true);
          studyDateInput.value = fmtDateInput(new Date());
          minutesInput.value = '';
          startTimeInput.value = '';
          endTimeInput.value = '';
          document.getElementById('topic').value = '';
          document.getElementById('memo').value = '';
        } else {
          throw new Error(json.message);
        }
      } catch (err) {
        statusEl.textContent = '送信エラー：GASを新バージョンで再デプロイしたか確認してください。';
      } finally {
        submitBtn.disabled = false;
      }
    };

    function fmtHours(mins) {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return h > 0 ? `${h}h ${m}m` : `${m}m`;
    }

    async function loadDashboard() {
      const dashStatus = document.getElementById('dashStatus');
      dashStatus.textContent = '読み込み中...';
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        if (data.status !== 'ok') throw new Error(data.message);

        if (data.materials && Object.keys(data.materials).length > 0) {
          materialsBySubject = data.materials;
        }

        const todayPct = data.today.planned > 0 ? Math.round((data.today.actual / data.today.planned) * 100) : 0;
        const weekPct = data.week.planned > 0 ? Math.round((data.week.actual / data.week.planned) * 100) : 0;

        document.getElementById('todayActual').textContent = fmtHours(data.today.actual);
        document.getElementById('todayPlanned').textContent = `予定: ${fmtHours(data.today.planned)} (${todayPct}%)`;
        document.getElementById('weekActual').textContent = fmtHours(data.week.actual);
        document.getElementById('weekPlanned').textContent = `予定: ${fmtHours(data.week.planned)} (${weekPct}%)`;

        const labels = SUBJECTS;
        const plannedHours = labels.map(s => Number(((data.bySubject.planned[s] || 0) / 60).toFixed(2)));
        const actualHours = labels.map(s => Number(((data.bySubject.actual[s] || 0) / 60).toFixed(2)));

        const ctx = document.getElementById('subjectChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              { label: '予定 (h)', data: plannedHours, backgroundColor: '#cbd5e1', borderRadius: 4 },
              { label: '実績 (h)', data: actualHours, backgroundColor: '#2563eb', borderRadius: 4 }
            ]
          },
          options: {
            responsive: true,
            scales: {
              y: { beginAtZero: true, title: { display: true, text: '時間 (h)' } }
            }
          }
        });

        dashStatus.textContent = '';
      } catch (err) {
        dashStatus.textContent = '取得エラー：GASを新バージョンで再デプロイしたか確認してください。';
      }
    }

    document.getElementById('refreshBtn').onclick = loadDashboard;
    syncFromCloud(false);
  </script>
</body>

</html>
