<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPA Study Logger</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 18px;
      background: #f3f4f6;
      padding: 4px;
      border-radius: 12px;
    }
    .tab-btn {
      border: none;
      background: transparent;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--muted);
      cursor: pointer;
    }
    .tab-btn.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .view { display: none; }
    .view.active { display: block; }

    .section { margin-bottom: 16px; }
    label.title {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .timer-box {
      text-align: center;
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .time-display {
      font-size: 2.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-bottom: 12px;
    }
    .timer-btns { display: flex; gap: 8px; justify-content: center; }
    .btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-full { width: 100%; padding: 14px; font-size: 1rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid var(--border);
      background: #fff;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.15s;
    }
    .chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .hint { font-size: 0.82rem; color: var(--muted); }
    input[type="number"], input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 70px; }
    .status {
      text-align: center;
      font-size: 0.85rem;
      margin-top: 10px;
      min-height: 1.2em;
      color: var(--muted);
    }

    /* ダッシュボード */
    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }
    .kpi-card {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .kpi-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    .kpi-value { font-size: 1.4rem; font-weight: 700; }
    .kpi-sub { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .chart-wrap {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" data-tab="logView">記録</button>
      <button class="tab-btn" data-tab="dashView">集計・グラフ</button>
    </div>

    <!-- 記録タブ -->
    <div id="logView" class="view active">
      <div class="section timer-box">
        <div class="time-display" id="display">00:00:00</div>
        <div class="timer-btns">
          <button class="btn btn-primary" id="startStopBtn">開始</button>
          <button class="btn" id="resetBtn">リセット</button>
        </div>
      </div>

      <div class="section">
        <label class="title">科目 *</label>
        <div class="chips" id="subjectChips"></div>
      </div>

      <div class="section">
        <label class="title">教材 *</label>
        <div class="chips" id="materialChips">
          <span class="hint">先に科目を選択してください</span>
        </div>
      </div>

      <div class="section">
        <label class="title" for="minutes">学習時間（分） *</label>
        <input type="number" id="minutes" min="1" placeholder="タイマー停止で自動入力（手入力も可）" />
      </div>

      <div class="section">
        <label class="title" for="topic">単元・ページ（任意）</label>
        <input type="text" id="topic" placeholder="例：連結会計 P.45〜52" />
      </div>

      <div class="section">
        <label class="title">手応え（任意）</label>
        <div class="chips" id="ratingChips"></div>
      </div>

      <div class="section">
        <label class="title" for="memo">一言メモ（任意）</label>
        <textarea id="memo" placeholder="つまずいた論点や次回の申し送りなど"></textarea>
      </div>

      <button class="btn btn-primary btn-full" id="submitBtn">スプレッドシートに記録する</button>
      <div class="status" id="status"></div>
    </div>

    <!-- 集計・グラフタブ -->
    <div id="dashView" class="view">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-label">今日の勉強時間</div>
          <div class="kpi-value" id="todayActual">--</div>
          <div class="kpi-sub" id="todayPlanned">カレンダー予定: --</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">今週の勉強時間（月〜日）</div>
          <div class="kpi-value" id="weekActual">--</div>
          <div class="kpi-sub" id="weekPlanned">カレンダー予定: --</div>
        </div>
      </div>

      <div class="chart-wrap">
        <label class="title">今週の科目別：予定 vs 実績（時間）</label>
        <canvas id="subjectChart" height="220"></canvas>
      </div>

      <button class="btn btn-full" id="refreshBtn">最新データを読み込む</button>
      <div class="status" id="dashStatus"></div>
    </div>
  </div>

  <script>
    // ===== 設定エリア =====
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzE8uqAzZaCao5IIh2P-9HtpbRxPpCO_hDPfG5tsFb7lxA9iXtgaxp5tI0Zi4VVtvb9/exec';

    // 科目ごとの教材リスト（自由に書き換えてください）
    const MATERIALS_BY_SUBJECT = {
      '財務(計算)': ['テキスト', '個別問題集', '短答問題集', '答練', '講義'],
      '財務(理論)': ['テキスト', '短答問題集', 'コンサマ', '答練', '講義'],
      '管理会計':   ['テキスト', '個別問題集', '短答問題集', '原価計算基準', '答練'],
      '監査論':     ['テキスト', '短答問題集', '資料集', '答練', '講義'],
      '企業法':     ['テキスト', '短答問題集', '条文・ポケット六法', '答練', '講義'],
      '租税法':     ['テキスト', '個別問題集', '理論対策', '答練', '講義'],
      '選択科目':   ['テキスト', '問題集', '答練', '講義']
    };
    const RATINGS = ['◎ 余裕', '○ 普通', '△ 要復習'];
    // =====================

    const SUBJECTS = Object.keys(MATERIALS_BY_SUBJECT);
    let selectedSubject = '';
    let selectedMaterial = '';
    let selectedRating = '';
    let chartInstance = null;

    // タブ切り替え
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'dashView') loadDashboard();
      };
    });

    // チップ生成
    function renderChips(containerId, items, onSelect) {
      const el = document.getElementById(containerId);
      el.innerHTML = '';
      items.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip';
        btn.textContent = item;
        btn.onclick = () => {
          [...el.children].forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
          onSelect(item);
        };
        el.appendChild(btn);
      });
    }

    // 科目選択時に教材リストを切り替え
    renderChips('subjectChips', SUBJECTS, subject => {
      selectedSubject = subject;
      selectedMaterial = '';
      renderChips('materialChips', MATERIALS_BY_SUBJECT[subject], m => selectedMaterial = m);
    });
    renderChips('ratingChips', RATINGS, v => selectedRating = v.split(' ')[0]);

    // タイマー管理
    const KEY_START = 'cpa_timer_start';
    const KEY_ACCUM = 'cpa_timer_accum';
    let timerInterval = null;
    const display = document.getElementById('display');
    const startStopBtn = document.getElementById('startStopBtn');
    const minutesInput = document.getElementById('minutes');

    function getElapsedSec() {
      const accum = Number(localStorage.getItem(KEY_ACCUM) || 0);
      const start = Number(localStorage.getItem(KEY_START) || 0);
      return start ? accum + Math.floor((Date.now() - start) / 1000) : accum;
    }
    function updateDisplay() {
      const sec = getElapsedSec();
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      display.textContent = `${h}:${m}:${s}`;
    }
    function startTimer() {
      if (!localStorage.getItem(KEY_START)) localStorage.setItem(KEY_START, String(Date.now()));
      startStopBtn.textContent = '停止';
      clearInterval(timerInterval);
      timerInterval = setInterval(updateDisplay, 500);
      updateDisplay();
    }
    function stopTimer() {
      const total = getElapsedSec();
      localStorage.setItem(KEY_ACCUM, String(total));
      localStorage.removeItem(KEY_START);
      clearInterval(timerInterval);
      startStopBtn.textContent = '再開';
      updateDisplay();
      if (total > 0) minutesInput.value = Math.max(1, Math.round(total / 60));
    }
    function resetTimer() {
      clearInterval(timerInterval);
      localStorage.removeItem(KEY_START);
      localStorage.removeItem(KEY_ACCUM);
      startStopBtn.textContent = '開始';
      updateDisplay();
    }

    startStopBtn.onclick = () => localStorage.getItem(KEY_START) ? stopTimer() : startTimer();
    document.getElementById('resetBtn').onclick = () => { resetTimer(); minutesInput.value = ''; };
    if (localStorage.getItem(KEY_START)) startTimer();
    else updateDisplay();

    // 記録送信
    document.getElementById('submitBtn').onclick = async () => {
      const statusEl = document.getElementById('status');
      if (localStorage.getItem(KEY_START)) stopTimer();

      const minutes = Number(minutesInput.value);
      if (!selectedSubject || !selectedMaterial || !minutes) {
        statusEl.textContent = '科目・教材・学習時間（分）を入力してください。';
        return;
      }

      const now = new Date();
      const dateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;

      const payload = {
        date: dateStr,
        subject: selectedSubject,
        material: selectedMaterial,
        minutes,
        topic: document.getElementById('topic').value.trim(),
        rating: selectedRating,
        memo: document.getElementById('memo').value.trim()
      };

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      statusEl.textContent = '送信中...';

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.status === 'ok') {
          statusEl.textContent = `記録しました（${selectedSubject} / ${selectedMaterial} / ${minutes}分）`;
          resetTimer();
          minutesInput.value = '';
          document.getElementById('topic').value = '';
          document.getElementById('memo').value = '';
        } else {
          throw new Error(json.message);
        }
      } catch (err) {
        statusEl.textContent = '送信エラー：URLやデプロイ設定を確認してください。';
      } finally {
        submitBtn.disabled = false;
      }
    };

    // 分を「〇h 〇m」表記に変換
    function fmtHours(mins) {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return h > 0 ? `${h}h ${m}m` : `${m}m`;
    }

    // ダッシュボード読み込み
    async function loadDashboard() {
      const dashStatus = document.getElementById('dashStatus');
      dashStatus.textContent = '読み込み中...';
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        if (data.status !== 'ok') throw new Error(data.message);

        const todayPct = data.today.planned > 0 ? Math.round((data.today.actual / data.today.planned) * 100) : 0;
        const weekPct = data.week.planned > 0 ? Math.round((data.week.actual / data.week.planned) * 100) : 0;

        document.getElementById('todayActual').textContent = fmtHours(data.today.actual);
        document.getElementById('todayPlanned').textContent = `予定: ${fmtHours(data.today.planned)} (${todayPct}%)`;
        document.getElementById('weekActual').textContent = fmtHours(data.week.actual);
        document.getElementById('weekPlanned').textContent = `予定: ${fmtHours(data.week.planned)} (${weekPct}%)`;

        const labels = SUBJECTS;
        const plannedHours = labels.map(s => Number(((data.bySubject.planned[s] || 0) / 60).toFixed(2)));
        const actualHours = labels.map(s => Number(((data.bySubject.actual[s] || 0) / 60).toFixed(2)));

        const ctx = document.getElementById('subjectChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              { label: '予定 (h)', data: plannedHours, backgroundColor: '#cbd5e1', borderRadius: 4 },
              { label: '実績 (h)', data: actualHours, backgroundColor: '#2563eb', borderRadius: 4 }
            ]
          },
          options: {
            responsive: true,
            scales: {
              y: { beginAtZero: true, title: { display: true, text: '時間 (h)' } }
            }
          }
        });

        dashStatus.textContent = '';
      } catch (err) {
        dashStatus.textContent = '取得エラー：GASを新バージョンで再デプロイしたか確認してください。';
      }
    }

    document.getElementById('refreshBtn').onclick = loadDashboard;
  </script>
</body>
</html>
